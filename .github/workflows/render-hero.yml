name: Render hero PNG

on:
  push:
    paths:
      - 'assets/hero.svg'
      - '.github/workflows/render-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render hero.png
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/hero.svg',
              write_to='assets/hero.png',
              output_width=1600,
              output_height=900,
          )
          PY

      - name: Commit rendered image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.png
          if git diff --cached --quiet; then
            echo "hero.png is already up to date"
          else
            git commit -m "Render hero.png"
            git push
          fi
