<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrator Text Reverser</title>
  <desc id="desc">Minimal editorial hero showing paragraph order before and after reversal in Adobe Illustrator.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.55" stop-color="#f5f2ed"/>
      <stop offset="1" stop-color="#dedbd6"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#3a342f" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0h660L470 245 0 218Z" fill="#ffffff" opacity="0.34"/>
  <path d="M0 900V690L300 900Z" fill="#d9d5d0" opacity="0.46"/>
  <path d="M1600 0v900h-300c98-113 170-250 200-405 29-151 16-322-39-495Z" fill="#aaa7a2" opacity="0.11"/>
  <ellipse cx="1320" cy="730" rx="360" ry="120" fill="#8e8984" opacity="0.06" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#wash)"/>

  <!-- Identity -->
  <g transform="translate(88 208)">
    <rect x="0" y="0" width="132" height="132" rx="25" fill="#24110d"/>
    <text x="66" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#f39a25">Ai</text>

    <text x="0" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="-2" fill="#171514">Illustrator</text>
    <text x="0" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="-2" fill="#171514">Text Reverser</text>

    <line x1="2" y1="374" x2="96" y2="374" stroke="#b96a37" stroke-width="4"/>

    <text x="0" y="438" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="0.4" fill="#77736f">Reverse the order of paragraphs</text>
    <text x="0" y="477" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="0.4" fill="#77736f">in your Illustrator text frames.</text>
    <text x="0" y="516" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="0.4" fill="#77736f">Fast. Simple. Free.</text>
  </g>

  <!-- Before -->
  <text x="818" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#4c4844">BEFORE</text>

  <g filter="url(#shadow)">
    <rect x="625" y="198" width="412" height="566" rx="25" fill="#fbfaf7" fill-opacity="0.94"/>
  </g>
  <rect x="676" y="248" width="310" height="464" fill="none" stroke="#58aaf0" stroke-width="2"/>
  <g fill="#67b0ef">
    <rect x="670" y="242" width="12" height="12"/><rect x="980" y="242" width="12" height="12"/>
    <rect x="670" y="706" width="12" height="12"/><rect x="980" y="706" width="12" height="12"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1c1a18">
    <text x="705" y="326">First paragraph</text>
    <text x="705" y="434">Second paragraph</text>
    <text x="705" y="542">Third paragraph</text>
    <text x="705" y="650">Fourth paragraph</text>
  </g>
  <g stroke="#bdb7b0" stroke-width="1.4">
    <line x1="705" y1="371" x2="957" y2="371"/>
    <line x1="705" y1="479" x2="957" y2="479"/>
    <line x1="705" y1="587" x2="957" y2="587"/>
  </g>

  <!-- Arrow -->
  <g stroke="#292725" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1068" y1="479" x2="1132" y2="479"/>
    <polyline points="1116,463 1132,479 1116,495"/>
  </g>

  <!-- After -->
  <text x="1368" y="171" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#4c4844">AFTER</text>

  <g filter="url(#shadow)">
    <rect x="1160" y="198" width="412" height="566" rx="25" fill="#faf9f6" fill-opacity="0.92"/>
  </g>
  <rect x="1211" y="248" width="310" height="464" fill="none" stroke="#58aaf0" stroke-width="2"/>
  <g fill="#67b0ef">
    <rect x="1205" y="242" width="12" height="12"/><rect x="1515" y="242" width="12" height="12"/>
    <rect x="1205" y="706" width="12" height="12"/><rect x="1515" y="706" width="12" height="12"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1c1a18">
    <text x="1240" y="326">Fourth paragraph</text>
    <text x="1240" y="434">Third paragraph</text>
    <text x="1240" y="542">Second paragraph</text>
    <text x="1240" y="650">First paragraph</text>
  </g>
  <g stroke="#bdb7b0" stroke-width="1.4">
    <line x1="1240" y1="371" x2="1492" y2="371"/>
    <line x1="1240" y1="479" x2="1492" y2="479"/>
    <line x1="1240" y1="587" x2="1492" y2="587"/>
  </g>
</svg>
