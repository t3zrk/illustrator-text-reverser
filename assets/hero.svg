<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrator Text Reverser</title>
  <desc id="desc">Minimal editorial hero showing paragraph order before and after reversal in Adobe Illustrator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="0.48" stop-color="#f0ede8"/>
      <stop offset="1" stop-color="#c8c5c1"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#25211d" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0h670L475 250 0 210Z" fill="#ffffff" opacity="0.34"/>
  <path d="M0 900V670L330 900Z" fill="#d4d0cb" opacity="0.58"/>
  <path d="M1600 0v900h-310c95-105 173-238 205-388 34-158 22-329-38-512Z" fill="#a9a7a4" opacity="0.13"/>
  <ellipse cx="1265" cy="707" rx="355" ry="116" fill="#8a8783" opacity="0.08" filter="url(#soft)"/>
  <rect width="1600" height="900" fill="url(#wash)" opacity="0.64"/>

  <!-- Left identity -->
  <g transform="translate(104 212)">
    <rect x="0" y="0" width="122" height="122" rx="25" fill="#24110d"/>
    <text x="61" y="81" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" fill="#f39a25">Ai</text>

    <text x="0" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#171514">Illustrator</text>
    <text x="0" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#171514">Text Reverser</text>

    <line x1="0" y1="366" x2="80" y2="366" stroke="#b16532" stroke-width="3"/>

    <text x="0" y="428" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0.6" fill="#77736f">Reverse the order of paragraphs</text>
    <text x="0" y="466" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0.6" fill="#77736f">in your Illustrator text frames.</text>
    <text x="0" y="504" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0.6" fill="#77736f">Fast. Simple. Free.</text>
  </g>

  <!-- Before label -->
  <text x="815" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#383532">BEFORE</text>

  <!-- Before card -->
  <g filter="url(#shadow)">
    <rect x="618" y="198" width="395" height="548" rx="24" fill="#faf9f6" fill-opacity="0.93"/>
  </g>
  <rect x="671" y="251" width="289" height="443" fill="none" stroke="#6bb4f2" stroke-width="2"/>
  <g fill="#72b7ef">
    <rect x="665" y="245" width="12" height="12"/><rect x="954" y="245" width="12" height="12"/>
    <rect x="665" y="688" width="12" height="12"/><rect x="954" y="688" width="12" height="12"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1c1a18">
    <text x="700" y="327">First paragraph</text>
    <text x="700" y="431">Second paragraph</text>
    <text x="700" y="535">Third paragraph</text>
    <text x="700" y="639">Fourth paragraph</text>
  </g>
  <g stroke="#b9b4ae" stroke-width="1.4">
    <line x1="700" y1="368" x2="931" y2="368"/>
    <line x1="700" y1="472" x2="931" y2="472"/>
    <line x1="700" y1="576" x2="931" y2="576"/>
  </g>

  <!-- Arrow -->
  <g stroke="#292725" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1047" y1="473" x2="1112" y2="473"/>
    <polyline points="1096,457 1112,473 1096,489"/>
  </g>

  <!-- After label -->
  <text x="1350" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#383532">AFTER</text>

  <!-- After card -->
  <g filter="url(#shadow)">
    <rect x="1156" y="198" width="395" height="548" rx="24" fill="#f8f7f4" fill-opacity="0.9"/>
  </g>
  <rect x="1209" y="251" width="289" height="443" fill="none" stroke="#6bb4f2" stroke-width="2"/>
  <g fill="#72b7ef">
    <rect x="1203" y="245" width="12" height="12"/><rect x="1492" y="245" width="12" height="12"/>
    <rect x="1203" y="688" width="12" height="12"/><rect x="1492" y="688" width="12" height="12"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#1c1a18">
    <text x="1238" y="327">Fourth paragraph</text>
    <text x="1238" y="431">Third paragraph</text>
    <text x="1238" y="535">Second paragraph</text>
    <text x="1238" y="639">First paragraph</text>
  </g>
  <g stroke="#b9b4ae" stroke-width="1.4">
    <line x1="1238" y1="368" x2="1469" y2="368"/>
    <line x1="1238" y1="472" x2="1469" y2="472"/>
    <line x1="1238" y1="576" x2="1469" y2="576"/>
  </g>
</svg>
